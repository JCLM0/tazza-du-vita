<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tazza Du Vita</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/base/style.css">
    <link rel="stylesheet" href="../css/utilities/variables.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body class="login-body">
    <header class="login-header">
        <nav class="login-navbar">
            <a href="../index.html"><img src="../assets/logos/white-logo.png" alt="Logo Tazza Du Vita"></a>
        </nav>
    </header>
    <section class="login-hero"></section>
    <main class="login-main">
        <h1>Welcome Back !</h1>
        <h2>Log in to continue your journey with Tazza Du Vita</h2>
        <form action="" class="log-form">
            <div class="log-form-input">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email">
            </div>
            <div class="log-form-input">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password">
            </div>
            <button class="log-form-btn" type="submit">Login</button>
            <p class="form-divider">OR</p>
            <button class="log-form-btn-google" type="button">
                <img src="../assets/logos/google-logo.png" alt="Google Logo">
                <span>Log in with Google</span>
            </button>
            <p>Don't have an account? <a href="../pages/register.html">Sign Up</a></p>
        </form>
    </main>
</body>
</html>
