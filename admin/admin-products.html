<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Panel de Administración | Tazza Du Vita</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../css/base/style.css">
    <link rel="stylesheet" href="../css/utilities/variables.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/modal.css">
    <link rel="stylesheet" href="../css/components/notifications.css">
    <link rel="stylesheet" href="../css/pages/admin-products.css">
</head>
<body class="admin-products-body">
    <header class="admin-products-header">
        <h1>Gestión de Productos</h1>
        <a href="dashboard.html">
            Volver al Dashboard
        </a>
    </header>
    <main class="admin-products-main">
        <div class="modal" id="product-modal">
            <section class="modal-form-section">
                <h2 id="modal-title">Registrar Producto</h2>
                <form id="product-form">
                    <input type="hidden" id="product-id">

                    <label for="product-name">Nombre</label>
                    <input
                        type="text"
                        id="product-name"
                        placeholder="Ingrese el nombre del producto"
                        maxlength="80"
                        autocomplete="off"
                        >

                    <label for="product-category">Categoría</label>
                    <select name="product-category" id="product-category" >
                        <option value="null">Seleccione una categoría</option>
                        <option value="plants">Plantas</option>
                        <option value="coffee">Cafe</option>
                        <option value="chocolate">Chocolate</option>
                    </select>

                    <label for="product-price">Precio</label>
                    <input
                        type="number"
                        id="product-price"
                        placeholder="Ingrese el precio del producto"
                        step="100"
                        >

                    <label for="product-stock">Stock</label>
                    <input
                        type="number"
                        id="product-stock"
                        placeholder="Ingrese el stock del producto"
                        step="1"
                        >

                    <label for="product-description">Descripción</label>
                    <textarea
                        id="product-description"
                        rows="4"
                        placeholder="Ingrese la descripción del producto"
                        minlength="10"
                        maxlength="400"
                        ></textarea>

                    <button type="submit" class="confirm-btn" id="confirm-modal-btn">Guardar Producto</button>
                    <button type="button" class="cancel-btn" id="close-modal-btn">Cancelar</button>
                </form>
            </section>
        </div>
        <h2>Listado de Productos Registrados, aqui pueden agregarse productos, editarlos y eliminarlos</h2>
        <section class="admin-products-table-section">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                </tbody>
            </table>
        </section>
        <button class="primary-btn" id="open-modal-btn">Agregar Producto</button>
    </main>
    <script type="module" src="../js/admin/admin-products.js"></script>
</body>

</html>
